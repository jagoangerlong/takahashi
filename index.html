<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takahashi — Family Legacy</title>
  <meta name="description" content="Silsilah, sejarah, dan galeri keluarga Takahashi." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <div class="wrap">
      <div class="brand" id="brand-name">Takahashi</div>
      <ul class="nav-links">
        <li><a href="#tree">Family Tree</a></li>
        <li><a href="#history">History</a></li>
        <li><a href="#members">Members</a></li>
        <li><a href="#gallery">Gallery</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero wrap">
    <div>
      <div class="hero-crest" id="hero-crest">高</div>
      <img class="hero-crest-img" id="hero-crest-img" alt="Lambang keluarga" hidden />
      <video class="hero-logo-video" id="hero-logo-video" autoplay loop muted playsinline hidden></video>
      <div class="hero-eyebrow">Family Legacy Archive</div>
      <h1 id="hero-name">Takahashi</h1>
      <p class="tagline" id="hero-tagline"></p>
    </div>
    <div class="hero-stats">
      <div>
        <div class="stat-num" id="stat-members">0</div>
        <div class="stat-label">Anggota keluarga</div>
      </div>
      <div>
        <div class="stat-num" id="stat-generations">0</div>
        <div class="stat-label">Generasi</div>
      </div>
    </div>
  </header>

  <section id="tree">
    <div class="wrap">
      <div class="section-head">
        <div class="kicker">The Bloodline</div>
        <h2>Family Tree</h2>
      </div>
      <div class="tree-controls">
        <button id="zoom-out" aria-label="Perkecil">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" aria-label="Perbesar">+</button>
        <button id="zoom-reset" aria-label="Reset zoom">Fit</button>
      </div>
      <div class="tree-scroll">
        <div class="tree-zoom" id="tree-zoom">
          <div id="tree-list"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="history" class="alt">
    <div class="wrap">
      <div class="section-head">
        <div class="kicker">The Chronicle</div>
        <h2>Family History</h2>
      </div>
      <div class="timeline" id="history-list"></div>
    </div>
  </section>

  <section id="members">
    <div class="wrap">
      <div class="section-head">
        <div class="kicker">The House</div>
        <h2>Family Members</h2>
      </div>
      <div class="members-toolbar">
        <input type="text" id="member-search" placeholder="Cari nama..." />
      </div>
      <div class="members-grid" id="members-grid"></div>
    </div>
  </section>

  <section id="gallery" class="alt">
    <div class="wrap">
      <div class="section-head">
        <div class="kicker">Memories</div>
        <h2>Family Gallery</h2>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <footer class="wrap">
    <div><span id="footer-name">Takahashi</span> Family Heritage Archive</div>
    <div>&copy; <span id="year"></span></div>
  </footer>

  <!-- Member detail modal -->
  <div class="overlay" id="member-overlay">
    <div class="modal" id="member-modal"></div>
  </div>

  <!-- Gallery lightbox -->
  <div class="overlay" id="gallery-overlay">
    <div class="modal lightbox" id="lightbox"></div>
  </div>

  <!-- Firebase CDN (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
